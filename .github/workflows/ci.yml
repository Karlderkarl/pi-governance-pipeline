# Runs the asset suite on every change to main and on every PR.
# Release publishing stays in release.yml — this workflow must not
# publish, mint an OIDC token, or write to the repo.
name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # 1000+ lines of bash covered only by an end-to-end suite. shellcheck
      # catches the class smoke.sh cannot: quoting and expansion bugs on a
      # branch the fixtures never take. Both files are clean at -S warning;
      # the two genuine false positives carry inline disable comments.
      - name: Shellcheck the shipped script and the suite
        run: shellcheck -S warning skills/governance-pipeline/assets/auto-develop.sh tests/smoke.sh

      - name: Smoke test pipeline assets
        run: bash tests/smoke.sh
