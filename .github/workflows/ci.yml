# Runs both suites on every change to main and on every PR.
# Release publishing stays in release.yml — this workflow must not
# publish, mint an OIDC token, or write to the repo.
name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 18
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 22
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      # The wrapper and the parity suite are the only shell left. shellcheck
      # catches the class the suite cannot: quoting and expansion bugs on a
      # branch the fixtures never take.
      - name: Shellcheck the wrapper and the suite
        if: runner.os == 'Linux'
        run: shellcheck -S warning tests/fixtures/auto-develop.sh tests/smoke.sh

      - name: Unit tests
        run: node --test tests/

      # The parity suite: every 1.0.x scenario plus the 1.2.0 additions,
      # against a stub pi and a stub claude. Needs bash (Git Bash on Windows).
      - name: Parity suite
        shell: bash
        run: bash tests/smoke.sh
