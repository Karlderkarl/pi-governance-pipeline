# Publishes to npm when a v* tag is pushed, using npm Trusted Publishing (OIDC).
#
# No token is stored anywhere. npm verifies the short-lived OIDC token GitHub
# mints for this workflow against the trusted publisher configured at
# https://www.npmjs.com/package/pi-governance-pipeline/access
#
# The tag must match the version in package.json, otherwise the job fails
# before it reaches the registry.
name: release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the GitHub Release for the tag
      id-token: write # required: this is what mints the OIDC token
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a recent npm; setup-node's bundled version
      # is not guaranteed to be new enough.
      - run: npm install -g npm@latest

      # The value of this package is the correctness of its assets — never
      # publish a tarball whose script or libraries fail the smoke test.
      - name: Smoke test pipeline assets
        run: bash tests/smoke.sh

      - name: Tag must match package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi
          echo "publishing $pkg"

      - name: Pack and inspect
        run: npm pack --dry-run

      - name: Publish
        run: npm publish

      # The GitHub Release comes last: it only exists when the tarball it
      # points at is already on npm. Curated notes (### Fixed / Added /
      # Changed plus a compare link) can be pre-seeded in release-notes.md;
      # otherwise the release falls back to generated notes.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f release-notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
