# Publishes to npm when a v* tag is pushed, using npm Trusted Publishing (OIDC).
#
# No token is stored anywhere. npm verifies the short-lived OIDC token GitHub
# mints for this workflow against the trusted publisher configured at
# https://www.npmjs.com/package/pi-governance-pipeline/access
#
# The tag must match the version in package.json, otherwise the job fails
# before it reaches the registry.
name: release

on:
  push:
    tags:
      - "v*"
  # Fallback when a tag push does not start the job. Always pass the
  # existing tag; a dispatch on main without this would publish "main".
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v1.0.11)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the GitHub Release for the tag
      id-token: write # required: this is what mints the OIDC token
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a recent npm; setup-node's bundled version
      # is not guaranteed to be new enough. Pinned to a major: the workflow
      # avoids long-lived tokens on purpose, so the client it publishes with
      # must not be whatever the registry served that minute either.
      - run: npm install -g npm@11

      # The value of this package is the correctness of its assets — never
      # publish a tarball whose script or libraries fail the smoke test.
      - name: Smoke test pipeline assets
        run: bash tests/smoke.sh

      - name: Tag must match package.json version
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *)
              echo "RELEASE_TAG must be a v* tag, got '$RELEASE_TAG'" >&2
              exit 1
              ;;
          esac
          tag="${RELEASE_TAG#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $RELEASE_TAG does not match package.json version $pkg" >&2
            exit 1
          fi
          echo "publishing $pkg"

      - name: Pack and inspect
        run: npm pack --dry-run

      - name: Publish
        run: npm publish

      # The GitHub Release comes last: it only exists when the tarball it
      # points at is already on npm. Curated notes (### Fixed / Added /
      # Changed plus a compare link) can be pre-seeded in release-notes.md.
      # Freshness guard: the file must name the tag being released, otherwise
      # it is a leftover from the previous release and would publish concrete
      # but wrong claims — generated notes are generic, but never wrong.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Freshness guard, anchored: the tag must appear on the right side
          # of the compare link (…v1.0.7...v1.0.8) or as a markdown heading.
          # The left side of the link does not count — re-tagging an old
          # release with newer notes present must fall back, not publish
          # notes that describe a different range.
          esc="${RELEASE_TAG//./\\.}"
          if [ -f release-notes.md ] && grep -Eq '(\.\.\.|^#+ )'"$esc"'([^0-9]|$)' release-notes.md; then
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
          fi
